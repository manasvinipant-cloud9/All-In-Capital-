# BACKUP only. The main 5-minute trigger is Supabase pg_cron. GitHub's free schedules can run hours late.
name: cron-backup
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call the app's cron route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          test -n "$APP_URL" -a -n "$CRON_SECRET" || { echo "APP_URL or CRON_SECRET secret is not set yet: nothing to do"; exit 0; }
          curl --fail --silent --show-error --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/queue"
